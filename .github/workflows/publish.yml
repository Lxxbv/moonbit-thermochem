name: Publish
"on":
  workflow_dispatch:
jobs:
  publish:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: post install
        run: |
          moon version --all
          moon update
      - name: moon check
        run: moon check --deny-warn
      - name: moon test
        run: moon test --deny-warn
      - name: publish
        env:
          MOONCAKES_CREDENTIALS_JSON: ${{ secrets.MOONCAKES_CREDENTIALS_JSON }}
        run: |
          if [ -z "$MOONCAKES_CREDENTIALS_JSON" ]; then
            echo "Skipping publish: MOONCAKES_CREDENTIALS_JSON is not configured."
            exit 0
          fi
          mkdir -p ~/.moon
          printf '%s' "$MOONCAKES_CREDENTIALS_JSON" > ~/.moon/credentials.json
          chmod 600 ~/.moon/credentials.json
          moon publish
