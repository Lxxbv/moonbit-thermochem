name: Publish
on:
  workflow_dispatch:
jobs:
  publish:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: post install
        run: |
          moon version --all
          moon update
      - name: moon check
        run: moon check --deny-warn
      - name: moon test
        run: moon test --deny-warn
      - name: publish
        if: ${{ secrets.MOONCAKES_TOKEN != '' }}
        env:
          MOONCAKES_TOKEN: ${{ secrets.MOONCAKES_TOKEN }}
        run: moon publish
